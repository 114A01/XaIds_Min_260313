{% extends "base.html" %}
{% block title %}流量紀錄 — XaIDS{% endblock %}
{% block content %}

<h1>// FLOW RECORDS <span class="muted" id="meta"></span></h1>

<div class="card" style="padding:0;overflow-x:auto">
  <table>
    <thead><tr><th>時間</th><th>測試</th><th>#</th><th>來源 → 目的</th><th>協定</th><th>真實標籤</th><th>預測</th><th>OK</th><th>信心值</th><th>ZONE</th><th></th></tr></thead>
    <tbody id="body"><tr><td colspan="11" class="muted">載入中…</td></tr></tbody>
  </table>
</div>

<script>
async function load() {
  const flows = await XA.fetchJson('/api/packetRecord?limit=500');
  document.getElementById('meta').textContent = `最近 ${flows.length} 筆`;
  document.getElementById('body').innerHTML = flows.map(f => {
    const correct = f.true_label == null ? null : f.true_label === f.predicted_label;
    return `<tr>
      <td class="muted">${XA.time(f.start_time)}</td>
      <td><a href="/history/${f.run_id}">${XA.esc(f.run_name)}</a></td>
      <td class="muted">${f.seq}</td>
      <td class="muted">${f.source_ip ? `${f.source_ip}:${f.source_port} → ${f.destination_ip}:${f.destination_port}` : '—'}</td>
      <td class="muted">${XA.esc(f.protocol ?? '—')}</td>
      <td>${XA.esc(f.true_label ?? '—')}</td><td>${XA.esc(f.predicted_label)}</td><td>${XA.correctMark(correct)}</td>
      <td>${XA.pct1(f.confidence)}</td><td>${XA.zoneBadge(f.conf_zone)}</td>
      <td><a href="/explain/${f.id}" style="font-size:11px">Explain</a></td></tr>`;
  }).join('') || '<tr><td colspan="11" class="muted">還沒有任何 flow</td></tr>';
}
load();
</script>
{% endblock %}
