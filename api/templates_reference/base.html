<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}XaIDS Dashboard{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --accent:   #4f8ef7;
      --danger:   #e05252;
      --warn:     #e0a652;
      --ok:       #52b788;
      --text:     #e2e4ec;
      --muted:    #6b6f82;
      --font:     'Courier New', 'Lucida Console', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 52px;
    }
    .nav-logo {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.05em;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    nav a:hover, nav a.active { color: var(--text); border-color: var(--accent); }

    /* ── Layout ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size: 15px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1.5rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: bold;
    }
    .badge-attack      { background: rgba(224,82,82,.15);  color: var(--danger); border: 1px solid rgba(224,82,82,.3); }
    .badge-suspicious  { background: rgba(224,166,82,.15); color: var(--warn);   border: 1px solid rgba(224,166,82,.3); }
    .badge-normal      { background: rgba(82,183,136,.15); color: var(--ok);     border: 1px solid rgba(82,183,136,.3); }
    .badge-pending     { background: rgba(107,111,130,.15);color: var(--muted);  border: 1px solid var(--border); }
    .badge-confirmed   { background: rgba(79,142,247,.15); color: var(--accent); border: 1px solid rgba(79,142,247,.3); }
    .badge-HIGH_CONF   { background: rgba(224,82,82,.15);  color: var(--danger); border: 1px solid rgba(224,82,82,.3); }
    .badge-SUSPICIOUS  { background: rgba(224,166,82,.15); color: var(--warn);   border: 1px solid rgba(224,166,82,.3); }
    .badge-UNCERTAIN   { background: rgba(107,111,130,.15);color: var(--muted);  border: 1px solid var(--border); }
    .badge-unhandled   { background: rgba(107,111,130,.15);color: var(--muted);  border: 1px solid var(--border); }
    .badge-processing  { background: rgba(79,142,247,.15); color: var(--accent); border: 1px solid rgba(79,142,247,.3); }
    .badge-resolved    { background: rgba(82,183,136,.15); color: var(--ok);     border: 1px solid rgba(82,183,136,.3); }
    .badge-false_positive { background: rgba(224,166,82,.15); color: var(--warn); border: 1px solid rgba(224,166,82,.3); }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 8px 12px;
      font-size: 11px; letter-spacing: 0.1em; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(42,45,58,.6); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Buttons ── */
    .btn {
      display: inline-block; padding: 6px 14px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); color: var(--text);
      font-family: var(--font); font-size: 12px; letter-spacing: 0.05em;
      cursor: pointer; text-decoration: none; transition: border-color .15s;
    }
    .btn:hover { border-color: var(--accent); text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #3a7de8; }

    /* ── Stat cards ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { text-align: center; }
    .stat-num  { font-size: 32px; font-weight: bold; margin: 4px 0; }
    .stat-label{ font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }

    /* ── Bar chart ── */
    .bar-wrap { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; transition: width .4s; }
    .bar-val   { font-size: 11px; color: var(--muted); min-width: 36px; text-align: right; }

    /* ── Confidence meter ── */
    .conf-bar {
      display: inline-flex; align-items: center; gap: 8px; width: 140px;
    }
    .conf-track {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .conf-fill { height: 100%; border-radius: 2px; }

    /* ── Section label ── */
    .section-label {
      color: var(--muted); font-size: 11px; letter-spacing: .1em; margin-bottom: .75rem;
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/">◈ XaIDS</a>
    <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>首頁</a>
    <a href="/packetRecord" {% if request.url.path.startswith("/packetRecord") %}class="active"{% endif %}>封包紀錄</a>
    <a href="/alertRecord" {% if request.url.path.startswith("/alertRecord") %}class="active"{% endif %}>警報紀錄</a>
    <a href="/analysis" {% if request.url.path.startswith("/analysis") %}class="active"{% endif %}>CSV 分析</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
