<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}XaIDS Dashboard{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --accent:   #4f8ef7;
      --danger:   #e05252;
      --warn:     #e0a652;
      --ok:       #52b788;
      --text:     #e2e4ec;
      --muted:    #6b6f82;
      --font:     'Courier New', 'Lucida Console', monospace;
    }

    [data-theme="light"] {
      --bg:      #f5f7fa;
      --surface: #ffffff;
      --border:  #d1d5de;
      --accent:  #2563eb;
      --danger:  #dc2626;
      --warn:    #d97706;
      --ok:      #16a34a;
      --text:    #1e2030;
      --muted:   #6b7280;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 52px;
    }
    .nav-logo {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-decoration: none;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.05em;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    nav a:hover, nav a.active { color: var(--text); border-color: var(--accent); }

    /* ── Layout ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    h1 { font-size: 15px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1.5rem; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: bold;
    }
    .badge-attack      { background: rgba(224,82,82,.15);  color: var(--danger); border: 1px solid rgba(224,82,82,.3); }
    .badge-suspicious  { background: rgba(224,166,82,.15); color: var(--warn);   border: 1px solid rgba(224,166,82,.3); }
    .badge-normal      { background: rgba(82,183,136,.15); color: var(--ok);     border: 1px solid rgba(82,183,136,.3); }
    .badge-pending     { background: rgba(107,111,130,.15);color: var(--muted);  border: 1px solid var(--border); }
    .badge-confirmed   { background: rgba(79,142,247,.15); color: var(--accent); border: 1px solid rgba(79,142,247,.3); }
    .badge-HIGH_CONF   { background: rgba(224,82,82,.15);  color: var(--danger); border: 1px solid rgba(224,82,82,.3); }
    .badge-SUSPICIOUS  { background: rgba(224,166,82,.15); color: var(--warn);   border: 1px solid rgba(224,166,82,.3); }
    .badge-UNCERTAIN   { background: rgba(107,111,130,.15);color: var(--muted);  border: 1px solid var(--border); }
    .badge-unhandled   { background: rgba(107,111,130,.15);color: var(--muted);  border: 1px solid var(--border); }
    .badge-processing  { background: rgba(79,142,247,.15); color: var(--accent); border: 1px solid rgba(79,142,247,.3); }
    .badge-resolved    { background: rgba(82,183,136,.15); color: var(--ok);     border: 1px solid rgba(82,183,136,.3); }
    .badge-false_positive { background: rgba(224,166,82,.15); color: var(--warn); border: 1px solid rgba(224,166,82,.3); }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 8px 12px;
      font-size: 11px; letter-spacing: 0.1em; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(128,128,128,.07); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Buttons ── */
    .btn {
      display: inline-block; padding: 6px 14px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); color: var(--text);
      font-family: var(--font); font-size: 12px; letter-spacing: 0.05em;
      cursor: pointer; text-decoration: none; transition: border-color .15s;
    }
    .btn:hover { border-color: var(--accent); text-decoration: none; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #3a7de8; }

    /* ── Stat cards ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { text-align: center; }
    .stat-num  { font-size: 32px; font-weight: bold; margin: 4px 0; }
    .stat-label{ font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }

    /* ── Bar chart ── */
    .bar-wrap { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; transition: width .4s; }
    .bar-val   { font-size: 11px; color: var(--muted); min-width: 36px; text-align: right; }

    /* ── Confidence meter ── */
    .conf-bar {
      display: inline-flex; align-items: center; gap: 8px; width: 140px;
    }
    .conf-track {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .conf-fill { height: 100%; border-radius: 2px; }

    /* ── Section label ── */
    .section-label {
      color: var(--muted); font-size: 11px; letter-spacing: .1em; margin-bottom: .75rem;
    }

    /* ── 新增：zone / 燈號 / k 選擇器 / 統計區塊 ── */
    .badge-BENIGN      { background: rgba(82,183,136,.15); color: var(--ok);     border: 1px solid rgba(82,183,136,.3); }
    .badge-DONE        { background: rgba(79,142,247,.15); color: var(--accent); border: 1px solid rgba(79,142,247,.3); }
    .badge-running     { background: rgba(79,142,247,.15); color: var(--accent); border: 1px solid rgba(79,142,247,.3); }
    .badge-done        { background: rgba(82,183,136,.15); color: var(--ok);     border: 1px solid rgba(82,183,136,.3); }
    .badge-stopped     { background: rgba(224,166,82,.15); color: var(--warn);   border: 1px solid rgba(224,166,82,.3); }
    .badge-error       { background: rgba(224,82,82,.15);  color: var(--danger); border: 1px solid rgba(224,82,82,.3); }
    .light { display:inline-flex; align-items:center; gap:6px; font-size:12px; white-space:nowrap; }
    .light-high { color: var(--ok); }
    .light-mid  { color: var(--warn); }
    .light-low  { color: var(--danger); }
    .light-none { color: var(--muted); }
    .light-hint { font-size:11px; color: var(--muted); }
    .k-label { font-size:11px; letter-spacing:.1em; color:var(--muted); margin-right:6px; }
    .k-btn { font-family:var(--font); font-size:12px; padding:3px 10px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; }
    .k-btn:first-of-type { border-radius:4px 0 0 4px; }
    .k-btn:last-of-type  { border-radius:0 4px 4px 0; }
    .k-btn.active { background: var(--accent); color:#fff; border-color: var(--accent); }
    .summary-strip { display:grid; grid-template-columns: repeat(6, 1fr); gap: .75rem; margin-bottom: 1rem; }
    .sum-tile { padding: .75rem .9rem; margin: 0; }
    .sum-val { font-size: 15px; font-weight: bold; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 1100px) { .summary-strip { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { .summary-strip { grid-template-columns: 1fr 1fr; } }
    .toolbar { display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:1rem; }
    .muted { color: var(--muted); font-size: 11px; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:1rem; }
    .grid3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:1rem; }
    @media (max-width: 860px) { .grid2, .grid3, .stats { grid-template-columns: 1fr !important; } }
    .card-title { font-size: 12px; letter-spacing:.05em; margin-bottom:.75rem; color: var(--text); }
    .chart-h { position:relative; height: 180px; }
    .chart-h-lg { position:relative; height: 240px; }
    table.mini td, table.mini th { padding: 6px 8px; font-size: 12px; }
    .field { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); letter-spacing:.05em; }
    .field input, .field select, .field textarea {
      background:var(--bg); border:1px solid var(--border); color:var(--text);
      font-family:var(--font); font-size:13px; padding:6px 10px; border-radius:4px; min-width: 160px;
    }
    .field textarea { min-height: 56px; resize: vertical; }
    .editable { cursor: text; border-bottom: 1px dashed var(--border); display:inline-block; min-width: 120px; min-height: 1.2em; }
    .editable:empty::before { content: '點擊編輯'; color: var(--muted); font-size: 11px; }
    .editable:hover { border-bottom-color: var(--accent); }
    .editable:focus { outline: none; border-bottom: 1px solid var(--accent); }
    .radio-group label { margin-right: 14px; cursor:pointer; font-size:13px; }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { border-color: var(--danger); }
    .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; margin-top:8px; font-size:12px; color:var(--muted); }
    /* 混淆矩陣（xaids.js renderConfusion） */
    table.cm { border-collapse: separate; border-spacing: 2px; width: auto; font-size: 12px; }
    table.cm th, table.cm td { border: none; padding: 6px 8px; }
    .cm-h { text-align: center; white-space: nowrap; font-weight: normal; color: var(--muted); min-width: 72px; }
    .cm-r { text-align: right; white-space: nowrap; }
    .cm-c { text-align: center; border-radius: 4px; min-width: 72px; font-variant-numeric: tabular-nums; }
    .cm-diag { box-shadow: inset 0 0 0 1px var(--border); }
    .cm-sub { font-size: 10px; opacity: .7; }
    .cm-t { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 12px; }
  </style>
  <script src="/static/chart.umd.js?v={{ static_v('chart.umd.js') }}"></script>
  <script src="/static/xaids.js?v={{ static_v('xaids.js') }}"></script>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/">◈ XaIDS</a>
    <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>首頁</a>
    <a href="/test" {% if request.url.path.startswith("/test") %}class="active"{% endif %}>測試</a>
    <a href="/history" {% if request.url.path.startswith("/history") %}class="active"{% endif %}>歷史</a>
    <a href="/demo" {% if request.url.path.startswith("/demo") %}class="active"{% endif %}>展示</a>
    <a href="/packetRecord" {% if request.url.path.startswith("/packetRecord") %}class="active"{% endif %}>流量紀錄</a>
    <button id="theme-toggle" class="btn" style="margin-left:auto; padding:4px 10px; font-size:13px;">☀</button>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <script>
    (function() {
      const html = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('xaids-theme') || 'dark';

      function applyTheme(theme) {
        if (theme === 'light') {
          html.setAttribute('data-theme', 'light');
          btn.textContent = '☾';
        } else {
          html.removeAttribute('data-theme');
          btn.textContent = '☀';
        }
        localStorage.setItem('xaids-theme', theme);
        window.dispatchEvent(new Event('xaids-theme'));
      }

      applyTheme(saved);

      btn.addEventListener('click', function() {
        const current = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        applyTheme(current);
      });
    })();
  </script>
</body>
</html>
